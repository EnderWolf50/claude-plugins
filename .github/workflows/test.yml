name: test

on:
  push:
  pull_request:

jobs:
  codex:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - run: python .github/test-codex.py

  versions:
    # marketplace.json, each plugin.json and each CHANGELOG.md name the same version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/check-versions.sh

  search-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The shells the hooks run under: /bin/bash is the system bash (3.2 on macOS;
      # plain `bash` there is Homebrew's 5.x), Git Bash on Windows.
      - if: runner.os != 'Windows'
        run: /bin/bash --version | head -1 && /bin/bash plugins/search-tools/tests/orphans.sh && /bin/bash plugins/search-tools/tests/grep-guard.sh
      - if: runner.os == 'Windows'
        run: bash plugins/search-tools/tests/orphans.sh && bash plugins/search-tools/tests/grep-guard.sh
        shell: bash

  skill-patches:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: /bin/bash plugins/skill-patches/tests/inject.sh
      - if: runner.os == 'Windows'
        run: bash plugins/skill-patches/tests/inject.sh
        shell: bash

  guards:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: /bin/bash plugins/guards/tests/bash-guard.sh
      - if: runner.os == 'Windows'
        run: bash plugins/guards/tests/bash-guard.sh
        shell: bash
